<!DOCTYPE html>
<!--
  Страница списка всех продуктов
  @author Baltinov
  @version 1.0
  @since 2025
-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Товары</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>📦 Управление товарами</h2>

    <!-- Сообщения об успехе/ошибке -->
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <a href="/products/new" class="btn btn-primary mb-3">➕ Добавить товар</a>
    <a href="/" class="btn btn-secondary mb-3">← На главную</a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Артикул</th>
            <th>Название</th>
            <th>Вес (г)</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.productSku}"></td>
            <td th:text="${product.productName}"></td>
            <td th:text="${product.productWeightG}"></td>
            <td>
                <a th:href="@{/products/edit/{sku}(sku=${product.productSku})}"
                   class="btn btn-sm btn-warning">✏️</a>
                <a th:href="@{/products/delete/{sku}(sku=${product.productSku})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('Удалить товар?')">🗑️</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
