<!DOCTYPE html>
<!--
  Форма для добавления/редактирования материалов
  @author Baltinov
  @version 1.0
  @since 2025
-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${material.materialId != null} ? 'Редактирование материала' : 'Новый материал'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${material.materialId != null} ? '✏️ Редактирование материала' : '➕ Новый материал'"></h2>

    <form th:action="${material.materialId != null} ?
                      @{/materials/update/{id}(id=${material.materialId})} :
                      @{/materials/save}"
          method="post" th:object="${material}">

        <!-- ID материала (скрытое поле для редактирования) -->
        <div th:if="${material.materialId != null}" class="mb-3">
            <label for="materialId" class="form-label">ID материала</label>
            <input type="text" class="form-control" id="materialId"
                   th:field="*{materialId}" readonly>
        </div>

        <div class="mb-3">
            <label for="materialType" class="form-label">Тип материала</label>
            <select class="form-control" id="materialType"
                    th:field="*{materialType}" required>
                <option value="">Выберите тип материала</option>
                <option value="PLA">PLA</option>
                <option value="PETG">PETG</option>
                <option value="TPU">TPU</option>
                <option value="ABS">ABS</option>
                <option value="NYLON">NYLON</option>
                <option value="RESIN">RESIN</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="materialColor" class="form-label">Цвет материала</label>
            <input type="text" class="form-control" id="materialColor"
                   th:field="*{materialColor}"
                   maxlength="50"
                   required
                   placeholder="Например: Красный, Синий, Черный..."
                   oninput="validateTextLength(this, 50)">
            <small class="form-text text-muted">Максимум 50 символов</small>
        </div>

        <button type="submit" class="btn btn-success">💾 Сохранить</button>
        <a href="/materials" class="btn btn-secondary">❌ Отмена</a>
    </form>
</div>

<!-- JavaScript для валидации текста -->
<script>
    function validateTextLength(input, maxLength) {
        if (input.value.length > maxLength) {
            input.value = input.value.slice(0, maxLength);
            alert('Максимальная длина: ' + maxLength + ' символов');
        }
    }
</script>
</body>
</html>
