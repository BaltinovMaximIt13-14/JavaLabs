<!DOCTYPE html>
<!--
  Страница списка всех материалов
  @author Baltinov
  @version 1.0
  @since 2025
-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Материалы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>🎨 Управление материалами</h2>

    <!-- Сообщения об успехе/ошибке -->
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <a href="/materials/new" class="btn btn-primary mb-3">➕ Добавить материал</a>
    <a href="/" class="btn btn-secondary mb-3">← На главную</a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Тип материала</th>
            <th>Цвет</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="material : ${materials}">
            <td th:text="${material.materialId}"></td>
            <td th:text="${material.materialType}"></td>
            <td th:text="${material.materialColor}"></td>
            <td>
                <a th:href="@{/materials/edit/{id}(id=${material.materialId})}"
                   class="btn btn-sm btn-warning">✏️</a>
                <a th:href="@{/materials/delete/{id}(id=${material.materialId})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('Удалить материал?')">🗑️</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
