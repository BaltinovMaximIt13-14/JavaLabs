<!DOCTYPE html>
<!--
  Страница списка всех производственных партий
  @author Baltinov
  @version 1.0
  @since 2025
-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Производственные партии</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>🏭 Управление производственными партиями</h2>

    <!-- Сообщения об успехе/ошибке -->
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <a href="/batches/new" class="btn btn-primary mb-3">➕ Добавить партию</a>
    <a href="/" class="btn btn-secondary mb-3">← На главную</a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID партии</th>
            <th>Дата производства</th>
            <th>Товар</th>
            <th>Материал</th>
            <th>Количество</th>
            <th>Расход материала</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="batch : ${batches}">
            <td th:text="${batch.batchId}"></td>
            <td th:text="${batch.productionDate}"></td>
            <td th:text="${batch.product.productName}"></td>
            <td th:text="${batch.material.materialType} + ' (' + ${batch.material.materialColor} + ')'"></td>
            <td th:text="${batch.batchQuantity}"></td>
            <td th:text="${batch.materialConsumptionG} + ' г'"></td>
            <td>
                <a th:href="@{/batches/edit/{id}(id=${batch.batchId})}"
                   class="btn btn-sm btn-warning">✏️</a>
                <a th:href="@{/batches/delete/{id}(id=${batch.batchId})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('Удалить партию?')">🗑️</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
