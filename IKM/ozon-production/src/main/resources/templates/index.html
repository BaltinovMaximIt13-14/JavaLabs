<!DOCTYPE html>
<!--

  @since 2025

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление производством Ozon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>🏭 Система управления производством Ozon</h1>

    <div class="row mt-4">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body text-center">
                    <h5 class="card-title">Товары</h5>
                    <p class="display-6" th:text="${productCount}"></p>
                    <a href="/products" class="btn btn-primary">Управление</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body text-center">
                    <h5 class="card-title">Материалы</h5>
                    <p class="display-6" th:text="${materialCount}"></p>
                    <a href="/materials" class="btn btn-success">Управление</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body text-center">
                    <h5 class="card-title">Партии</h5>
                    <p class="display-6" th:text="${batchCount}"></p>
                    <a href="/batches" class="btn btn-warning">Управление</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
